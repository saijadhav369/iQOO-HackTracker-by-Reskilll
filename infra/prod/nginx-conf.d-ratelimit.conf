# Copies to /etc/nginx/conf.d/ratelimit.conf
# limit_req_zone must live in http{} context, which the conf.d/ directory is
# included into. The site config (sites-available/hacktracker) consumes these
# zones with limit_req directives inside its location{} blocks.
#
# Zone sizing: 10MB stores ~160k unique IPs. Far more than a hackathon's worth.
# Rates are sustained averages; burst absorbs short spikes.

limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=heartbeat:10m rate=200r/s;
