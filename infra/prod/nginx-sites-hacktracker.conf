# Copies to /etc/nginx/sites-available/hacktracker (replace existing).
# Adds:
#   - HTTPS-only: IP-based requests on :80 get 444 (drop connection)
#     and the domain on :80 redirects to https (existing certbot rule kept).
#   - Per-endpoint rate limiting (zones declared in conf.d/ratelimit.conf).
#   - HSTS + standard hardening headers.
#   - Gzip for JSON/JS/CSS.
#   - Connection-reuse to the upstream so we're not opening a fresh TCP per req.
#
# certbot will re-edit this file if you ever run `certbot renew --force-renew`
# with --nginx; if so, re-apply this template afterwards.

# Upstream pool so keepalive works (huge win at 200+ req/s).
upstream hacktracker_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Drop anything that hits the IP directly — only the hostname is served.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTP → HTTPS for the real hostname
server {
    listen 80;
    listen [::]:80;
    server_name hacktracker.reskilll.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hacktracker.reskilll.com;

    # Certbot-managed cert + Mozilla-Intermediate-ish defaults
    ssl_certificate     /etc/letsencrypt/live/hacktracker.reskilll.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hacktracker.reskilll.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Security headers — applied to every response (incl. errors via 'always').
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip text payloads. JSON dominates our wire traffic.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # ── auth endpoints: aggressive throttle to slow brute force
    location ~ ^/api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://hacktracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── heartbeat: high-volume telemetry, generous burst, per-IP throttled to
    #    catch a single rogue phone without affecting the rest
    location = /api/device/heartbeat {
        limit_req zone=heartbeat burst=400 nodelay;
        limit_req_status 429;
        proxy_pass http://hacktracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── everything else under /api: moderate per-IP cap
    location ~ ^/api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://hacktracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── default: pages, static assets — no rate limit
    location / {
        proxy_pass http://hacktracker_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# WebSocket upgrade map — required for proxy_set_header Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
